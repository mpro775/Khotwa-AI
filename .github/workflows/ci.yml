name: Foundation checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.11.1"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r services/math-engine/requirements-dev.lock
      - run: npm ci --no-audit --no-fund
      - run: npm run verify
      - run: npm run test:editor
      - run: npm run verify:ph03
      - run: npm run test:api
      - run: npm run test:workspace
      - run: npm run test:diagnosis
      - run: npm run test:tutoring
  api-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.11.1"
      - run: node tools/verify-ph04-container.mjs
      - run: node tools/verify-ph05-container.mjs
      - run: node tools/verify-ph06-container.mjs
  tutoring:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.11.1"
      - run: node tools/verify-ph07-container.mjs
