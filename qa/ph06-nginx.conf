server {
    listen 8443 ssl;
    server_name localhost;
    ssl_certificate /etc/nginx/ph06-tls/cert.pem;
    ssl_certificate_key /etc/nginx/ph06-tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 16k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    location ^~ /internal { return 403; }
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 35s;
    }
    location / { try_files $uri $uri/ /index.html; }
}
