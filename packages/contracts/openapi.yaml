x-khotwa-internal-math:
  visibility: private-network-only; NOT browser endpoints and NOT served by NestJS public proxy
  operations:
    - method: POST
      path: /internal/v1/math/parse
      requestSchema: Math parser contract to finalize in 10-MATH-ENGINE.md
    - method: POST
      path: /internal/v1/math/verify-transition
      requestSchema: '#/components/schemas/InternalMathTransitionRequest'
      responseSchema: '#/components/schemas/InternalMathTransitionResult'
    - method: POST
      path: /internal/v1/math/check-final
      requestSchema: Math final-check contract to finalize in 10-MATH-ENGINE.md
    - method: GET
      path: /internal/health
      requestSchema: none
  rules:
    - private network + service authentication
    - bounded deadline and resources
    - schema version matching
    - never DB student access
    - Never parse_expr or sympify on raw student input
    - number evidence as Rational, never float
paths:
  /api/v1/bootstrap:
    get:
      tags:
        - تهيئة
      summary: تهيئة الواجهة والحصول على رمز CSRF والقدرات المدعومة
      operationId: getBootstrap
      description: نقطة دخول من نفس الأصل. تُصدر رمز CSRF مرتبطًا بملف ارتباط موقّع منفصل، ولا تُصدر صلاحية طالب بحد ذاتها. لا تُخزن الاستجابة في ذاكرة مشتركة.
      x-khotwa-priority: P0
      x-source-requirements:
        - MVP-01
        - AN-DEC-01
      responses:
        '200':
          description: تمت العملية.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapEnvelope'
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
            Set-Cookie:
              description: ملف ارتباط تمهيدي مُوقّع خاص بـCSRF، وليس جلسة طالب.
              schema:
                type: string
        '400':
          $ref: '#/components/responses/E400'
        '429':
          $ref: '#/components/responses/E429'
        '500':
          $ref: '#/components/responses/E500'
      security: []
  /api/v1/guest-sessions:
    post:
      tags:
        - الجلسات
      summary: بدء تجربة ضيف دون بيانات شخصية
      operationId: createGuestSession
      description: إنشاء جلسة ضيف عبر Cookie HttpOnly Secure SameSite وفق قرار الأمان. يرفض الخادم Origin غير المعتمد وContent-Type غير JSON. إذا وُجدت جلسة صالحة تعاد 200 ولا تنشأ جلسة موازية بالخطأ.
      x-khotwa-priority: P0
      x-source-requirements:
        - MVP-01
        - DATA-AC-01
      responses:
        '201':
          description: تم إنشاء جلسة ضيف.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestEnvelope'
          headers:
            Set-Cookie:
              description: kh_guest بخصائص HttpOnly وSecure وSameSite؛ لا يُرجع السر في JSON.
              schema:
                type: string
        '400':
          $ref: '#/components/responses/E400'
        '403':
          $ref: '#/components/responses/E403'
        '409':
          $ref: '#/components/responses/E409'
        '422':
          $ref: '#/components/responses/E422'
        '429':
          $ref: '#/components/responses/E429'
        '500':
          $ref: '#/components/responses/E500'
        '200':
          description: الجلسة الموجودة صالحة وأُعيدت دون تكرار.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestEnvelope'
      parameters:
        - $ref: '#/components/parameters/Csrf'
      security: []
      requestBody:
        required: true
        description: حمولة JSON ذات مخطط مضبوط. المقادير الرياضية لا تُرسل كـ AST غير موثوقة.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGuestInput'
  /api/v1/guest-sessions/current:
    get:
      tags:
        - الجلسات
      summary: قراءة حالة جلسة الضيف الحالية
      operationId: getCurrentGuestSession
      description: ''
      x-khotwa-priority: P0
      x-source-requirements:
        - MVP-01
      responses:
        '200':
          description: تمت العملية.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestCurrentEnvelope'
        '401':
          $ref: '#/components/responses/E401'
        '410':
          $ref: '#/components/responses/E410'
        '429':
          $ref: '#/components/responses/E429'
        '500':
          $ref: '#/components/responses/E500'
      security:
        - GuestCookie: []
        - AccountCookie: []
    delete:
      tags:
        - الجلسات
      summary: إبطال جلسة الضيف ومسح الكوكي
      operationId: revokeGuestSession
      description: إبطال رمز الدخول يختلف عن محو بيانات التعليم؛ سياسة الحذف والاحتفاظ تُعتمد في 16-SECURITY-PRIVACY.md.
      x-khotwa-priority: P0
      x-source-requirements:
        - MVP-12
      responses:
        '204':
          description: تمت العملية بلا جسم.
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '409':
          $ref: '#/components/responses/E409'
        '429':
          $ref: '#/components/responses/E429'
        '500':
          $ref: '#/components/responses/E500'
      parameters:
        - $ref: '#/components/parameters/Csrf'
        - $ref: '#/components/parameters/Idempotency'
      security:
        - GuestCookie: []
        - AccountCookie: []
  /api/v1/learning-sessions:
