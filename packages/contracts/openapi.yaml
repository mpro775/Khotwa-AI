  /api/v1/problems:
    get:
      tags:
        - المسائل
      summary: قائمة المسائل المنشورة والمسموحة للمسار
      operationId: listProblems
      description: تعرض فقط مسائل kind=main المنشورة القابلة للبدء من الكتالوج؛ لا تكشف مسألة نقل أو علاج غير مسندة، حتى لو عُرف معرفها.
