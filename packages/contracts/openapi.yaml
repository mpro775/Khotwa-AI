components:
  securitySchemes:
    GuestCookie:
      type: apiKey
      in: cookie
      name: kh_guest
      description: جلسة ضيف عشوائية عبر HttpOnly+Secure+SameSite cookie؛ token digest فقط بقاعدة البيانات.
    InternalHealthToken:
      type: http
      scheme: bearer
      bearerFormat: internal-health-token
      description: مصادقة فحوص الصحة فقط على الشبكة الداخلية؛ proxy العام يحجب المسار.
    AccountCookie:
      type: apiKey
      in: cookie
      name: kh_account
      description: Opaque 256-bit account session; Secure HttpOnly SameSite=Lax Path=/; digest only in PostgreSQL
  parameters:
    AttemptId:
      name: attemptId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: هوية المحاولة؛ لا تُعد دليل ملكية.
    StepId:
      name: stepId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SkillId:
      name: skillId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProblemId:
      name: problemId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LearningSessionId:
      name: learningSessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EpisodeId:
      name: episodeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProbeId:
      name: probeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VerificationResultId:
      name: verificationResultId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ExampleId:
      name: exampleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Csrf:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 32
      description: رمز CSRF مستخرج من bootstrap؛ مطلوب مع cookies لجميع العمليات المحدثة.
    Idempotency:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]+$
        minLength: 8
        maxLength: 128
      description: مفتاح فريد للعملية؛ إعادة المفتاح مع الحمولة نفسها تعيد نتيجة العملية دون تكرار الآثار. يُحفظ ملخصه فقط.
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        maxLength: 256
      description: مؤشر صفحات معتم؛ لا تفسره الواجهة.
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 30
        default: 15
  responses:
    E400:
      description: طلب JSON غير صالح أو رأس مفقود.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
      headers:
        X-Request-Id:
          description: معرّف تتبع يصلح للدعم دون مشاركة بيانات الطالب.
          schema:
            type: string
            format: uuid
    E401:
      description: جلسة ضيف غير موجودة أو انتهت.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
      headers:
        X-Request-Id:
          description: معرّف تتبع يصلح للدعم دون مشاركة بيانات الطالب.
          schema:
            type: string
            format: uuid
    E403:
      description: جلسة مصادق عليها لكن الإجراء غير مسموح.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
      headers:
        X-Request-Id:
          description: معرّف تتبع يصلح للدعم دون مشاركة بيانات الطالب.
          schema:
            type: string
            format: uuid
    E404:
      description: المورد غير موجود أو ليس ضمن ملكية الجلسة.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
      headers:
        X-Request-Id:
          description: معرّف تتبع يصلح للدعم دون مشاركة بيانات الطالب.
          schema:
            type: string
            format: uuid
    E409:
      description: تعارض إصدار أو مفتاح تكرار أو حالة سير العمل.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
      headers:
        X-Request-Id:
          description: معرّف تتبع يصلح للدعم دون مشاركة بيانات الطالب.
          schema:
            type: string
            format: uuid
    E410:
      description: جلسة أبطلت أو محتوى لم يعد صالحًا وفق السياسة.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
      headers:
        X-Request-Id:
          description: معرّف تتبع يصلح للدعم دون مشاركة بيانات الطالب.
          schema:
            type: string
            format: uuid
    E422:
      description: مدخلات صحيحة JSON لكنها تخالف قيود DTO أو سياسة العملية.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
      headers:
        X-Request-Id:
          description: معرّف تتبع يصلح للدعم دون مشاركة بيانات الطالب.
          schema:
            type: string
            format: uuid
    E429:
      description: حد الطلبات تجاوز الحدود المعتمدة.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
      headers:
        X-Request-Id:
          description: معرّف تتبع يصلح للدعم دون مشاركة بيانات الطالب.
          schema:
            type: string
            format: uuid
        Retry-After:
          description: ثوانٍ أو وقت HTTP عند انطباقه.
          schema:
            type: string
    E503:
      description: خدمة معتمدة غير متاحة؛ لا يصنَّف الطالب مخطئًا.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
      headers:
        X-Request-Id:
          description: معرّف تتبع يصلح للدعم دون مشاركة بيانات الطالب.
          schema:
            type: string
            format: uuid
        Retry-After:
          description: ثوانٍ أو وقت HTTP عند انطباقه.
          schema:
            type: string
    E500:
      description: عطل خادمي غير متوقع.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
      headers:
        X-Request-Id:
          description: معرّف تتبع يصلح للدعم دون مشاركة بيانات الطالب.
          schema:
            type: string
            format: uuid
  schemas:
    Meta:
      type: object
      additionalProperties: false
      properties:
        requestId:
          type: string
          description: معرّف تتبع الطلب.
          format: uuid
        serverTime:
          type: string
          description: وقت الاستجابة UTC.
          format: date-time
        apiVersion:
          type: string
          description: إصدار الواجهة.
          example: '1'
      required:
        - requestId
        - serverTime
        - apiVersion
    ProblemKind:
      type: string
      description: نوع المسألة من نسخة المحتوى المنشورة.
      enum:
        - main
        - remediation
        - transfer
        - diagnostic
    MathStatus:
      type: string
      description: حكم محرك الرياضيات؛ لا يساوي تشخيصًا تربويًا.
      enum:
        - verified_valid
        - verified_invalid
        - syntax_error
        - unsupported
        - inconclusive
        - service_error
    DiagnosisState:
      type: string
      description: حالة فرضية الخطأ، وليست حكمًا على الطالب.
      enum:
        - tentative
        - needs_probe
        - supported_by_probe
        - rejected
        - unresolved
    AttemptKind:
      type: string
      enum:
        - main
        - probe
        - remediation
        - transfer
    AttemptStatus:
      type: string
      enum:
        - in_progress
        - completed
        - assisted_completed
        - stopped
    LearningEpisodeState:
      type: string
      enum:
        - proposed
        - probing
        - remediating
        - awaiting_transfer
        - finished
        - cancelled
    HintLevel:
      type: string
      description: المساعدة من دون تلميح إلى الحل الكامل.
      enum:
        - H0
        - H1
        - H2
        - H3
        - H4
    ProgressState:
      type: string
      enum:
        - not_assessed
        - needs_followup
        - practice_with_support
        - new_evidence_of_understanding
    VerificationScope:
      type: string
      description: التحقق من انتقال واحد أو السلسلة كاملة.
      enum:
        - target_edge
        - current_sequence
    Rational:
      type: object
      additionalProperties: false
      description: تمثيل دقيق للنسب؛ لا تستخدم float.
      properties:
        num:
          type: string
          description: البسط العشري كنص صحيح موقع.
          pattern: ^-?(0|[1-9][0-9]*)$
          example: '2'
        den:
          type: string
          description: المقام العشري كنص صحيح موجب، ولا يساوي صفرًا.
          pattern: ^[1-9][0-9]*$
          example: '1'
      required:
        - num
        - den
    MathSource:
      type: object
      additionalProperties: false
      properties:
        sourceRaw:
          type: string
          description: الصيغة العربية كما أدخلها الطالب دون استبدال صامت.
          maxLength: 256
          example: ٢س + ٦ = ١٠
        displayAr:
          anyOf:
            - type: string
              description: العرض العربي الذي صادق عليه المحرك بعد التحليل.
            - type: 'null'
        parseStatus:
          type: string
          description: حالة التحليل البنيوي.
          enum:
            - not_checked
            - parsed
            - syntax_error
            - unsupported
            - inconclusive
      required:
        - sourceRaw
        - displayAr
        - parseStatus
    MathIssue:
      type: object
      additionalProperties: false
      properties:
        reasonCode:
          type: string
          description: رمز ثابت مثل AMBIGUOUS_DIVISION.
          maxLength: 80
        messageAr:
          type: string
          description: رسالة عربية قابلة للعرض دون traceback.
        spanStart:
          anyOf:
            - type: integer
              format: int32
              description: موضع البداية بوحدات Unicode code points.
              minimum: 0
            - type: 'null'
        spanEnd:
          anyOf:
            - type: integer
              format: int32
              description: نهاية المدى حصريًا.
              minimum: 0
            - type: 'null'
        spanUnit:
          type: string
          enum:
            - unicode_codepoint
        hintKey:
          anyOf:
            - type: string
              description: مفتاح رسالة توجيهية.
              maxLength: 80
            - type: 'null'
      required:
        - reasonCode
        - messageAr
        - spanStart
        - spanEnd
        - spanUnit
        - hintKey
    SolutionSet:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          description: مجموعة حل المعادلة الخطية ضمن الأعداد الحقيقية.
          enum:
            - singleton
            - all_reals
            - empty
        value:
          anyOf:
            - $ref: '#/components/schemas/Rational'
            - type: 'null'
      required:
        - kind
        - value
    Counterexample:
      type: object
      additionalProperties: false
      properties:
        variable:
          type: string
          enum:
            - س
        value:
          $ref: '#/components/schemas/Rational'
        satisfiesPrevious:
          type: boolean
        satisfiesNext:
          type: boolean
      required:
        - variable
        - value
        - satisfiesPrevious
        - satisfiesNext
    MathEvidence:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          enum:
            - counterexample
            - solution_set
            - rule_violation
            - none
        domain:
          type: string
          enum:
            - reals
        previousSolution:
          anyOf:
            - $ref: '#/components/schemas/SolutionSet'
            - type: 'null'
        nextSolution:
          anyOf:
            - $ref: '#/components/schemas/SolutionSet'
            - type: 'null'
        witness:
          anyOf:
            - $ref: '#/components/schemas/Counterexample'
            - type: 'null'
        summaryAr:
          anyOf:
            - type: string
              description: شرح الدليل بعد التحقق الرياضي، وليس توليدًا غير موثق.
            - type: 'null'
      required:
        - kind
        - domain
        - previousSolution
        - nextSolution
        - witness
        - summaryAr
    DiagnosisCandidate:
      type: object
      additionalProperties: false
      properties:
        diagnosisId:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
        state:
          $ref: '#/components/schemas/DiagnosisState'
        errorCode:
          anyOf:
            - type: string
              description: كود خطأ من ERR-ALG-01 إلى ERR-ALG-06.
              pattern: ^ERR-ALG-0[1-6]$
            - type: 'null'
        skillId:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
        explanationAr:
          type: string
          description: صياغة احتمالية، لا حكم قطعي.
        needsProbe:
          type: boolean
      required:
        - diagnosisId
        - state
        - errorCode
        - skillId
        - explanationAr
        - needsProbe
    Capabilities:
      type: object
      additionalProperties: false
      properties:
        notationProfile:
          type: string
          enum:
            - ar-mashriq-school-v1
        subject:
          type: string
          enum:
            - algebra
        variable:
          type: string
          enum:
            - س
        mathModes:
          type: array
          items:
            type: string
            enum:
              - linear_one_variable
        supportsTrigonometry:
          type: boolean
          default: false
        supportsHandwriting:
          type: boolean
          default: false
        supportsFractions:
          type: boolean
          description: تفعيل الكسور يخضع لنجاح اختبارات العرض.
          default: false
        supportsTeacherRealData:
          type: boolean
          default: false
        supportedMathStatuses:
          type: array
          items:
            $ref: '#/components/schemas/MathStatus'
      required:
        - notationProfile
        - subject
        - variable
        - mathModes
        - supportsTrigonometry
        - supportsHandwriting
        - supportsFractions
        - supportsTeacherRealData
        - supportedMathStatuses
    BootstrapData:
      type: object
      additionalProperties: false
      properties:
        csrfToken:
          type: string
          description: رمز حماية ضد تزوير الطلبات، ليس رمز جلسة دخول.
          minLength: 32
        csrfHeaderName:
          type: string
          enum:
            - X-CSRF-Token
        capabilities:
          $ref: '#/components/schemas/Capabilities'
        hasActiveGuestSession:
          type: boolean
      required:
        - csrfToken
        - csrfHeaderName
        - capabilities
        - hasActiveGuestSession
    GuestSession:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - active
            - expired
            - revoked
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - status
        - expiresAt
        - createdAt
    GuestCreateData:
      type: object
      additionalProperties: false
      properties:
        session:
          $ref: '#/components/schemas/GuestSession'
        csrfToken:
          type: string
          description: رمز حماية جديد إن تم تدويره بعد إصدار الجلسة؛ يستبدل الرمز السابق.
          minLength: 32
      required:
        - session
        - csrfToken
    LearningSession:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - active
            - ended
            - abandoned
        releaseId:
          type: string
          format: uuid
        startedAt:
          type: string
          format: date-time
        endedAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        isSynthetic:
          type: boolean
          description: تكون false دائمًا في جلسات الطلاب الحقيقيين.
      required:
        - id
        - status
        - releaseId
        - startedAt
        - endedAt
        - isSynthetic
    Skill:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          description: كود ثابت مثل SK-ALG-03.
          pattern: ^SK-ALG-0[1-8]$
        titleAr:
          type: string
        objectiveAr:
          type: string
        prerequisiteSkillIds:
          type: array
          items:
            type: string
            format: uuid
        availableProblemCount:
          type: integer
          format: int32
          minimum: 0
        availability:
          type: string
          enum:
            - available
            - unavailable
      required:
        - id
        - code
        - titleAr
        - objectiveAr
        - prerequisiteSkillIds
        - availableProblemCount
        - availability
    ProblemSummary:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          description: هوية المسألة الأساسية.
          format: uuid
        revisionId:
          type: string
          description: النسخة المنشورة المحددة.
          format: uuid
        titleAr:
          type: string
        kind:
          $ref: '#/components/schemas/ProblemKind'
        skillId:
          type: string
          format: uuid
        difficultyBand:
          type: integer
          format: int32
          minimum: 1
          maximum: 5
        notationProfile:
          type: string
        contentReleaseId:
          type: string
          format: uuid
      required:
        - id
        - revisionId
        - titleAr
        - kind
        - skillId
        - difficultyBand
        - notationProfile
        - contentReleaseId
    ProblemDetail:
      type: object
      additionalProperties: false
      description: لا تتضمن الحل المرجعي أو answer_spec أو بيانات الإجابة الصحيحة للطالب.
      properties:
        id:
          type: string
          format: uuid
        revisionId:
          type: string
          format: uuid
        versionNumber:
          type: integer
          format: int32
