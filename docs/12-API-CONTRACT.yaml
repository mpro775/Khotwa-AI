# Khotwa AI — NestJS Public API Contract (OpenAPI 3.1)
# الحالة: مسودة تنفيذية للمراجعة والاعتماد؛ المعايير العددية التي لم تعتمد بعد موسومة في قرارات العقد.
# لا تضاف خدمة Python/SymPy الداخلية إلى المسارات العامة.
openapi: 3.1.0
info:
  title: خُطوة AI — عقد واجهات NestJS
  version: 1.0.0-draft
  description: |
    مواصفة OpenAPI 3.1 لنسخة هاكثون شِراع (P0).

    واجهة React لا تتصل إلا بـNestJS؛ محرك Python/SymPy داخلي ولا يظهر بمسارات API عامة.
    المتغير الرياضي في واجهة الطالب «س»، والأرقام الافتراضية عربية، ومفاتيح JSON البرمجية إنجليزية.
    تعرض واجهة الطالب رسائل عربية، ولا تعتمد استجابة قديمة بعد زيادة attempt.revision.

    **الحالة:** عقد مقترح للمراجعة وليس توثيقًا لواجهات منفذة بالفعل.
    **المراجع:** 00-PROJECT-VISION.md، 01-PRD.md، 02-MVP-SCOPE.md، 04-ARABIC-NOTATION.md، 05-CURRICULUM.md، 06-MISCONCEPTIONS.md، 07-TUTORING-POLICY.md، 08-UX-DESIGN.md، 09-SYSTEM-ARCHITECTURE.md، 10-MATH-ENGINE.md، 11-DATA-MODEL.md.

    **النطاق:** معادلات خطية بمجهول واحد «س»، معاملات صحيحة وكسور عددية بسيطة وفق اختبارات العرض؛ جا وجتا والبرمجة والفيزياء والكيمياء والصور خارج P0.
  contact:
    name: Khotwa AI Product Team
servers:
- url: /
  description: نفس أصل تطبيق الويب عبر Reverse Proxy؛ المسارات العامة تبدأ /api/v1.
tags:
- name: تهيئة
  description: حماية CSRF وقدرات النسخة.
- name: الجلسات
  description: جلسة ضيف محدودة وجلسة تعلم مستقلة.
- name: المنهج
  description: المهارات ذات محتوى معتمد.
- name: المسائل
  description: المسائل المنشورة دون مفاتيح حلول.
- name: المحاولات
  description: إنشاء المحاولات واسترجاع النسخ الحالية.
- name: الخطوات
  description: إنشاء وتعديل وحذف خطوات بنظام نسخ.
- name: التحقق الرياضي
  description: تحديد الصحة بالدليل أو الامتناع.
- name: التشخيص
  description: أسئلة تأكيد وفرضيات أخطاء.
- name: التعليم والتلميحات
  description: سلم التلميحات وتسجيل المساعدة.
- name: التعلم العلاجي
  description: تدريب على مهارة ومسألة نقل جديدة.
- name: التقدم
  description: أدلة تعلم وملخصات غير مضللة.
- name: لوحة المعلم التجريبية
  description: بيانات اصطناعية مميزة عن الحقيقي.
- name: التشغيل الداخلي
  description: مسارات تشغيلية لا تمر عبر الوكيل العام.
x-khotwa-spec-status: draft-needs-team-approval
x-khotwa-api-invariants:
- id: API-INV-01
  description: استعمال session cookie وليس UUID لإثبات ملكية كل مورد؛ يعيد NestJS 404 للموارد غير المملوكة.
- id: API-INV-02
  description: كل عملية كتابة على محاولة تتطلب expectedRevision يطابق الحالة المحفوظة وتزيده ذريًا عند تغيير الخطوات.
- id: API-INV-03
  description: كل عملية تغيير للأحداث تُحمى بـIdempotency-Key ونطاق guest+operation مع بصمة حمولة؛ تكرار مختلف يسبب
    409.
- id: API-INV-04
  description: عند تغير خطوة، لا يُعاد اعتماد أحكام أو تشخيصات أو تلميحات مبنية على النسخ القديمة، وإن ظلت محفوظة
    تاريخيًا.
- id: API-INV-05
  description: لا يُرسل المتصفح AST موثوقة ولا نتائج صحة ولا diagnosis state ولا mastery score؛ كلها مشتقات خادمية.
- id: API-INV-06
  description: syntax_error وunsupported وinconclusive وservice_error ليست دليل تعثر الطالب ولا تنشئ خطأ مفاهيميًا
    سلبيًا.
- id: API-INV-07
  description: التحقق يعتمد مجموعة حلول معادلة خطية بمجال الأعداد الحقيقية، لا تشابه نص المعادلتين.
- id: API-INV-08
  description: لا يدعي نظام التعليم أن طالبًا أتقن نهائيًا بعد مسألة واحدة؛ يخزن أدلة جديدة مع ظروف المساعدة.
- id: API-INV-09
  description: مسألة النقل مختلفة عن أمثلة الشرح السابقة ولا تعرض حلًا خلال التقييم المستقل.
- id: API-INV-10
  description: لوحة المعلم P0 تعرض بيانات تركيبية فقط مع وسم واضح؛ ولا تعرض بيانات جلسات الضيوف الحقيقية.
- id: API-INV-11
  description: مخرجات Python/LLM لا تمرر مباشرة للواجهة؛ NestJS يتحقق من schema ومن نسخ السياق ومن السياسات.
- id: API-INV-12
  description: مفاتيح الحماية وأوامر التشخيص ونصوص الطلاب والبيانات الحساسة لا تسجل في access logs.
- id: API-INV-13
  description: لا تظهر في كتالوج الطلاب مسائل transfer أو remediation أو إجاباتها قبل إسنادها، ولا يكفي معرفة UUID
    لكشفها.
- id: API-INV-14
  description: GET learning-episodes يعيد الإسنادات التي أصبحت متاحة فقط، ولا يسرّب مسألة النقل قبل وصول الطالب
    إلى حالتها.
- id: API-INV-15
  description: جميع استجابات بيانات الضيف والطلبات التعليمية private,no-store؛ حذف جلسة الضيف يمسح cookie ولا يساوي
    بالضرورة حذف البيانات التاريخية.
- id: API-INV-16
  description: POST guest-sessions المكرر مع cookie صالح يعيد الجلسة نفسها؛ في السباق قبل وصول cookie يربط الخادم
    طلب الإنشاء بالـCSRF bootstrap الموقّع لمنع تكرار الجلسة.
x-khotwa-architecture:
  primaryBackend: NestJS / TypeScript
  database: PostgreSQL
  internalMath: Python + SymPy via private HTTP/JSON, not FastAPI
  aiIntegration: NestJS provider adapter with reviewed fallback
  frontend: React + TypeScript
