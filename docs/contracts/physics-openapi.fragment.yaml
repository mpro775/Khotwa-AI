paths:
  /api/v1/physics/problems:
    get:
      operationId: listPhysicsProblems
      tags:
        - الفيزياء
      security:
        - GuestCookie: []
        - AccountCookie: []
      responses:
        "200":
          description: استجابة موثوقة من NestJS دون مفتاح الحل
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhysicsProblemListEnvelope"
        "401":
          description: جلسة غير صالحة
        "403":
          description: أصل الطلب أو CSRF غير صالح
        "404":
          description: مورد غير متاح
        "409":
          description: مراجعة قديمة أو مفتاح متعارض
        "422":
          description: مدخل غير صالح
        "503":
          description: تعذر المحرك أو التلميح المراجع
  /api/v1/physics/problems/{id}:
    get:
      operationId: getPhysicsProblem
      tags:
        - الفيزياء
      security:
        - GuestCookie: []
        - AccountCookie: []
      parameters:
        - &a1
          name: id
          in: path
          required: true
          schema: &a4
            type: string
            format: uuid
      responses:
        "200":
          description: استجابة موثوقة من NestJS دون مفتاح الحل
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhysicsProblemEnvelope"
        "401":
          description: جلسة غير صالحة
        "403":
          description: أصل الطلب أو CSRF غير صالح
        "404":
          description: مورد غير متاح
        "409":
          description: مراجعة قديمة أو مفتاح متعارض
        "422":
          description: مدخل غير صالح
        "503":
          description: تعذر المحرك أو التلميح المراجع
  /api/v1/physics/attempts:
    post:
      operationId: submitPhysicsAnswer
      tags:
        - الفيزياء
      security:
        - GuestCookie: []
        - AccountCookie: []
      parameters:
        - &a2
          name: X-CSRF-Token
          in: header
          required: true
          schema:
            type: string
            minLength: 32
            maxLength: 200
        - &a3
          name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 16
            maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhysicsAttemptInput"
      responses:
        "200":
          description: استجابة موثوقة من NestJS دون مفتاح الحل
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhysicsAttemptEnvelope"
        "401":
          description: جلسة غير صالحة
        "403":
          description: أصل الطلب أو CSRF غير صالح
        "404":
          description: مورد غير متاح
        "409":
          description: مراجعة قديمة أو مفتاح متعارض
        "422":
          description: مدخل غير صالح
        "503":
          description: تعذر المحرك أو التلميح المراجع
  /api/v1/physics/attempts/{id}/hints:
    post:
      operationId: requestPhysicsHint
      tags:
        - الفيزياء
      security:
        - GuestCookie: []
        - AccountCookie: []
      parameters:
        - *a1
        - *a2
        - *a3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhysicsHintInput"
      responses:
        "200":
          description: استجابة موثوقة من NestJS دون مفتاح الحل
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhysicsHintEnvelope"
        "401":
          description: جلسة غير صالحة
        "403":
          description: أصل الطلب أو CSRF غير صالح
        "404":
          description: مورد غير متاح
        "409":
          description: مراجعة قديمة أو مفتاح متعارض
        "422":
          description: مدخل غير صالح
        "503":
          description: تعذر المحرك أو التلميح المراجع
  /api/v1/physics/attempts/{id}:
    get:
      operationId: resumePhysicsAttempt
      tags:
        - الفيزياء
      security:
        - GuestCookie: []
        - AccountCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: استعادة محاولة يملكها المستخدم مع نسخة السؤال المثبتة
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhysicsResumeEnvelope"
        "401":
          description: جلسة غير صالحة
        "404":
          description: محاولة غير متاحة
  /api/v1/physics/attempts/{id}/learning:
    get:
      operationId: getPhysicsLearningLoop
      tags:
        - الفيزياء
      security:
        - GuestCookie: []
        - AccountCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: إسنادات فيزياء مملوكة مرتبطة بإصدار الأصل؛ النقل مستقل بلا تلميحات
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhysicsLearningEnvelope"
        "400":
          $ref: "#/components/responses/E400"
        "401":
          $ref: "#/components/responses/E401"
        "403":
          $ref: "#/components/responses/E403"
        "404":
          $ref: "#/components/responses/E404"
        "409":
          $ref: "#/components/responses/E409"
        "422":
          $ref: "#/components/responses/E422"
        "429":
          $ref: "#/components/responses/E429"
        "500":
          $ref: "#/components/responses/E500"
        "503":
          $ref: "#/components/responses/E503"
  /api/v1/physics/attempts/{id}/remediation:
    post:
      operationId: startPhysicsRemediation
      tags:
        - الفيزياء
      security:
        - GuestCookie: []
        - AccountCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/Idempotency"
      responses:
        "200":
          description: إسنادات فيزياء مملوكة مرتبطة بإصدار الأصل؛ النقل مستقل بلا تلميحات
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhysicsLearningEnvelope"
        "400":
          $ref: "#/components/responses/E400"
        "401":
          $ref: "#/components/responses/E401"
        "403":
          $ref: "#/components/responses/E403"
        "404":
          $ref: "#/components/responses/E404"
        "409":
          $ref: "#/components/responses/E409"
        "422":
          $ref: "#/components/responses/E422"
        "429":
          $ref: "#/components/responses/E429"
        "500":
          $ref: "#/components/responses/E500"
        "503":
          $ref: "#/components/responses/E503"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhysicsLearningInput"
  /api/v1/physics/attempts/{id}/transfer:
    post:
      operationId: startPhysicsTransfer
      tags:
        - الفيزياء
      security:
        - GuestCookie: []
        - AccountCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/Idempotency"
      responses:
        "200":
          description: إسنادات فيزياء مملوكة مرتبطة بإصدار الأصل؛ النقل مستقل بلا تلميحات
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhysicsLearningEnvelope"
        "400":
          $ref: "#/components/responses/E400"
        "401":
          $ref: "#/components/responses/E401"
        "403":
          $ref: "#/components/responses/E403"
        "404":
          $ref: "#/components/responses/E404"
        "409":
          $ref: "#/components/responses/E409"
        "422":
          $ref: "#/components/responses/E422"
        "429":
          $ref: "#/components/responses/E429"
        "500":
          $ref: "#/components/responses/E500"
        "503":
          $ref: "#/components/responses/E503"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhysicsLearningInput"
components:
  schemas:
    PhysicsProblem:
      type: object
      additionalProperties: false
      properties:
        id: *a4
        problemId: *a4
        revisionId: *a4
        code:
          type: string
          maxLength: 80
        titleAr:
          type: string
          maxLength: 160
        statementAr:
          type: string
          maxLength: 3000
        unitCode:
          type: string
          maxLength: 80
        lessonCode:
          type: string
          maxLength: 80
        lessonTitleAr:
          type: string
          maxLength: 160
        skillCodes:
          type: array
          items:
            type: string
            maxLength: 80
        difficulty:
          type: integer
          minimum: 1
          maximum: 3
        quantity:
          type: string
          maxLength: 80
        givens:
          type: object
          additionalProperties:
            type: string
            maxLength: 48
        allowedUnits:
          type: array
          items:
            type: string
            maxLength: 16
      required:
        - id
        - problemId
        - revisionId
        - code
        - titleAr
        - statementAr
        - unitCode
        - lessonCode
        - lessonTitleAr
        - skillCodes
        - difficulty
        - quantity
        - givens
        - allowedUnits
    PhysicsAttempt:
      type: object
      additionalProperties: false
      properties:
        id: *a4
        problemRevisionId: *a4
        revision:
          type: integer
          minimum: 0
        status:
          type: string
          enum:
            - correct
            - wrong_value
            - wrong_unit
            - unsupported
            - invalid_input
            - service_error
        valueCorrect:
          type:
            - boolean
            - "null"
        unitCorrect:
          type:
            - boolean
            - "null"
        messageAr:
          type: string
          maxLength: 2000
        diagnosis:
          type: object
          additionalProperties: false
          properties:
            state:
              type: string
              enum:
                - possible
                - unresolved
            code:
              type:
                - string
                - "null"
            messageAr:
              type: string
              maxLength: 2000
          required:
            - state
            - code
            - messageAr
        independentEvidence:
          type: boolean
        assistanceLevel:
          type: integer
          minimum: 0
          maximum: 4
      required:
        - id
        - problemRevisionId
        - revision
        - status
        - valueCorrect
        - unitCorrect
        - messageAr
        - diagnosis
        - independentEvidence
        - assistanceLevel
    PhysicsHint:
      type: object
      additionalProperties: false
      properties:
        attemptId: *a4
        revision:
          type: integer
          minimum: 0
        level:
          type: integer
          minimum: 1
          maximum: 4
        textAr:
          type: string
          maxLength: 1200
        source:
          type: string
          enum:
            - reviewed_template
            - llm_validated
        independentEvidence:
          const: false
        reasonAr:
          type: string
          maxLength: 2000
      required:
        - attemptId
        - revision
        - level
        - textAr
        - source
        - independentEvidence
        - reasonAr
    PhysicsAttemptInput:
      type: object
      additionalProperties: false
      properties:
        problemRevisionId: *a4
        value:
          type: string
          minLength: 1
          maxLength: 28
        unit:
          type: string
          maxLength: 16
        attemptId: *a4
        expectedRevision:
          type: integer
          minimum: 0
      required:
        - problemRevisionId
        - value
        - unit
    PhysicsHintInput:
      type: object
      additionalProperties: false
      properties:
        level:
          type: integer
          minimum: 1
          maximum: 4
        confirmFullSolution:
          type: boolean
        expectedRevision:
          type: integer
          minimum: 0
      required:
        - level
        - expectedRevision
    PhysicsProblemEnvelope:
      type: object
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/PhysicsProblem"
        meta:
          $ref: "#/components/schemas/Meta"
      required:
        - data
        - meta
    PhysicsProblemListEnvelope:
      type: object
      additionalProperties: false
      properties:
        data:
          type: object
          additionalProperties: false
          properties:
            items:
              type: array
              maxItems: 200
              items:
                $ref: "#/components/schemas/PhysicsProblem"
          required:
            - items
        meta:
          $ref: "#/components/schemas/Meta"
      required:
        - data
        - meta
    PhysicsAttemptEnvelope:
      type: object
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/PhysicsAttempt"
        meta:
          $ref: "#/components/schemas/Meta"
      required:
        - data
        - meta
    PhysicsHintEnvelope:
      type: object
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/PhysicsHint"
        meta:
          $ref: "#/components/schemas/Meta"
      required:
        - data
        - meta
    PhysicsResumeEnvelope:
      type: object
      additionalProperties: false
      required:
        - data
        - meta
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            - problem
            - result
            - value
            - unit
          properties:
            problem:
              $ref: "#/components/schemas/PhysicsProblem"
            result:
              $ref: "#/components/schemas/PhysicsAttempt"
            value:
              type: string
              maxLength: 28
            unit:
              type: string
              maxLength: 16
        meta:
          $ref: "#/components/schemas/Meta"
    PhysicsLearningInput:
      type: object
      additionalProperties: false
      properties:
        expectedRevision:
          type: integer
          minimum: 0
          maximum: 2147483647
      required:
        - expectedRevision
    PhysicsLearningAssignment:
      type: object
      additionalProperties: false
      properties:
        id: &a5
          type: string
          format: uuid
        phase:
          enum:
            - remediation
            - transfer
        attemptId: *a5
        problem:
          $ref: "#/components/schemas/PhysicsProblem"
        status:
          enum:
            - assigned
            - completed
            - invalidated
        independent:
          type: boolean
      required:
        - id
        - phase
        - attemptId
        - problem
        - status
        - independent
    PhysicsLearningLoop:
      type: object
      additionalProperties: false
      properties:
        episodeId:
          anyOf:
            - &a5
              type: string
              format: uuid
            - type: "null"
        rootAttemptId: *a5
        rootRevision:
          type: integer
          minimum: 0
          maximum: 2147483647
        state:
          enum:
            - not_started
            - remediating
            - awaiting_transfer
            - finished
            - cancelled
        reasonAr:
          type: string
          minLength: 1
          maxLength: 2000
        assignments:
          type: array
          maxItems: 2
          items:
            $ref: "#/components/schemas/PhysicsLearningAssignment"
      required:
        - episodeId
        - rootAttemptId
        - rootRevision
        - state
        - reasonAr
        - assignments
    PhysicsLearningEnvelope:
      type: object
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/PhysicsLearningLoop"
        meta:
          $ref: "#/components/schemas/Meta"
      required:
        - data
        - meta
