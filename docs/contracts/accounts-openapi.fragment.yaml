components:
  securitySchemes:
    AccountCookie:
      type: apiKey
      in: cookie
      name: kh_account
      description: Opaque 256-bit account session; Secure HttpOnly SameSite=Lax Path=/; digest only in PostgreSQL
  schemas:
    AccountUser:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum:
            - student
            - teacher
            - content_manager
            - admin
        status:
          type: string
          enum:
            - active
            - suspended
            - deletion_requested
            - deleted
        isInternal:
          type: boolean
      required:
        - id
        - email
        - role
        - status
        - isInternal
    AccountIdentity:
      type: object
      additionalProperties: false
      properties:
        user:
          anyOf:
            - $ref: "#/components/schemas/AccountUser"
            - type: "null"
        csrfToken:
          type: string
          minLength: 32
        guestAvailable:
          type: boolean
        loginCsrfToken:
          type: string
          minLength: 32
      required:
        - user
        - csrfToken
        - guestAvailable
    AccountEmailRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
      required:
        - email
    AccountEmailVerify:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        challengeId:
          type: string
          format: uuid
        code:
          type: string
          pattern: ^[0-9]{6}$
      required:
        - email
        - challengeId
        - code
    AccountClaimInput:
      type: object
      additionalProperties: false
      properties:
        consent:
          const: true
      required:
        - consent
    AccountDeletionInput:
      type: object
      additionalProperties: false
      properties:
        confirm:
          const: true
      required:
        - confirm
    AccountEmptyInput:
      type: object
      additionalProperties: false
      properties: {}
      required: []
    AccountAttempt:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        learningSessionId:
          type: string
          format: uuid
        problemRevisionId:
          type: string
          format: uuid
        problemId:
          type: string
          format: uuid
        revision:
          type: integer
          minimum: 0
        status:
          type: string
        completionVerdict:
          anyOf:
            - type: string
            - type: "null"
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - learningSessionId
        - problemRevisionId
        - problemId
        - revision
        - status
        - completionVerdict
        - updatedAt
    AccountSubjectAttempt:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        subjectCode:
          type: string
          enum:
            - physics
            - programming
        problemRevisionId:
          type: string
          format: uuid
        revision:
          type: integer
          minimum: 0
        sourceRaw:
          type: string
          maxLength: 49152
        answer: {}
        verdict: {}
        assistanceLevel:
          type: integer
          minimum: 0
          maximum: 4
        independent:
          type: boolean
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - subjectCode
        - problemRevisionId
        - revision
        - sourceRaw
        - answer
        - verdict
        - assistanceLevel
        - independent
        - updatedAt
    SubjectProgressEvidence:
      type: object
      additionalProperties: false
      properties:
        subjectCode:
          type: string
          enum:
            - physics
            - programming
        skillCode:
          type: string
        evidenceCount:
          type: integer
          minimum: 0
        independentCount:
          type: integer
          minimum: 0
        assistedCount:
          type: integer
          minimum: 0
        state:
          type: string
          enum:
            - not_assessed
            - new_independent_evidence
            - assisted_evidence
            - needs_review
        updatedAt:
          type: string
          format: date-time
      required:
        - subjectCode
        - skillCode
        - evidenceCount
        - independentCount
        - assistedCount
        - state
        - updatedAt
    AccountProgress:
      type: object
      additionalProperties: false
      properties:
        skills:
          type: array
          items:
            $ref: "#/components/schemas/SkillProgress"
          maxItems: 1000
        subjects:
          type: array
          items:
            $ref: "#/components/schemas/SubjectProgressEvidence"
          maxItems: 1000
        noteAr:
          type: string
      required:
        - skills
        - subjects
        - noteAr
    AccountStepExport:
      type: object
      additionalProperties: false
      properties:
        attemptId:
          type: string
          format: uuid
        position:
          type: integer
          minimum: 0
        version:
          type: integer
          minimum: 0
        sourceRaw:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - attemptId
        - position
        - version
        - sourceRaw
        - createdAt
    BetaFeedbackInput:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          enum:
            - bug
            - content
            - suggestion
            - other
        message:
          type: string
          minLength: 3
          maxLength: 2000
        requestId:
          type: string
          format: uuid
      required:
        - kind
        - message
    BetaFeedback:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
            - bug
            - content
            - suggestion
            - other
        message:
          type: string
          maxLength: 2000
        requestId:
          anyOf:
            - type: string
              format: uuid
            - type: "null"
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - kind
        - message
        - requestId
        - createdAt
    BetaRevokeInput:
      type: object
      additionalProperties: false
      properties:
        userId:
          type: string
          format: uuid
      required:
        - userId
    BetaMetrics:
      type: object
      additionalProperties: false
      properties:
        day:
          type: string
          format: date
        api:
          type: object
          additionalProperties: false
          properties:
            requestCount:
              type: integer
              minimum: 0
            sampleCount:
              type: integer
              minimum: 0
              maximum: 1000
            status4xx:
              type: integer
              minimum: 0
            status5xx:
              type: integer
              minimum: 0
            p50Ms:
              anyOf:
                - type: integer
                  minimum: 0
                - type: "null"
            p95Ms:
              anyOf:
                - type: integer
                  minimum: 0
                - type: "null"
          required:
            - requestCount
            - sampleCount
            - status4xx
            - status5xx
            - p50Ms
            - p95Ms
        ai:
          type: object
          additionalProperties: false
          properties:
            calls:
              type: integer
              minimum: 0
            hintRequests:
              type: integer
              minimum: 0
            fallback:
              type: integer
              minimum: 0
            fallbackRatio:
              anyOf:
                - type: number
                  minimum: 0
                  maximum: 1
                - type: "null"
            inputTokens:
              type: integer
              minimum: 0
            outputTokens:
              type: integer
              minimum: 0
            estimatedCostMicros:
              type: integer
              minimum: 0
            unknownCostCalls:
              type: integer
              minimum: 0
            timeouts:
              type: integer
              minimum: 0
          required:
            - calls
            - hintRequests
            - fallback
            - fallbackRatio
            - inputTokens
            - outputTokens
            - estimatedCostMicros
            - unknownCostCalls
            - timeouts
        mathTimeouts:
          type: integer
          minimum: 0
        scope:
          type: string
        percentileMinimumSamples:
          type: integer
          minimum: 0
        usage:
          type: object
          additionalProperties: false
          properties:
            sessionsToday:
              type: integer
              minimum: 0
            attemptsToday:
              type: integer
              minimum: 0
            hintsToday:
              type: integer
              minimum: 0
          required:
            - sessionsToday
            - attemptsToday
            - hintsToday
        database:
          type: string
          enum:
            - ready
            - unavailable
        disk:
          anyOf:
            - type: object
              additionalProperties: false
              properties:
                availableBytes:
                  type: number
                  minimum: 0
                totalBytes:
                  type: number
                  minimum: 0
              required:
                - availableBytes
                - totalBytes
            - type: "null"
        feedback:
          type: array
          items:
            $ref: "#/components/schemas/BetaFeedback"
          maxItems: 50
        limits:
          type: object
          additionalProperties: false
          properties:
            dailyCostMicros:
              type: integer
              minimum: 0
            monthlyCostMicros:
              type: integer
              minimum: 0
            userDailyCalls:
              type: integer
              minimum: 0
          required:
            - dailyCostMicros
            - monthlyCostMicros
            - userDailyCalls
        noteAr:
          type: string
      required:
        - day
        - api
        - ai
        - mathTimeouts
        - scope
        - percentileMinimumSamples
        - usage
        - database
        - disk
        - feedback
        - limits
        - noteAr
    AccountCurrentEnvelope:
      type: object
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/AccountIdentity"
        meta:
          $ref: "#/components/schemas/Meta"
      required:
        - data
        - meta
    AccountEmailRequestEnvelope:
      type: object
      additionalProperties: false
      properties:
        data:
          type: object
          additionalProperties: false
          properties:
            challengeId:
              type: string
              format: uuid
            expiresInSeconds:
              type: integer
              minimum: 0
            resendAfterSeconds:
              type: integer
              minimum: 0
            delivery:
              const: queued
          required:
            - challengeId
            - expiresInSeconds
            - resendAfterSeconds
            - delivery
        meta:
          $ref: "#/components/schemas/Meta"
      required:
        - data
        - meta
    AccountVerifyEnvelope:
      type: object
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/AccountIdentity"
        meta:
          $ref: "#/components/schemas/Meta"
      required:
